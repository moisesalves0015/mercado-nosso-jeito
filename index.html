<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dela+Gothic+One&family=Righteous&family=Titan+One&family=Archivo+Black&family=Manrope:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Granesta';
        src: url('/Granesta.otf') format('opentype'),
             url('/Granesta.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
    </style>
    <!-- Anti-FOUC: Apply theme class before any rendering to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.add('light-mode-pending');
            document.addEventListener('DOMContentLoaded', function() {
              document.body.classList.add('light-mode');
              document.documentElement.classList.remove('light-mode-pending');
            });
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* Prevent FOUC on body before React loads */
      html.light-mode-pending { background: #f8fafc !important; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090705" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- SEO -->
    <meta name="description" content="Mercado do Nosso Jeito — Compras rápidas e convenientes com entrega direto no seu condomínio. Bebidas, eletrônicos, tabacaria e muito mais." />
    <meta name="robots" content="index, follow" />
    <!-- Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <title>Mercado do Nosso Jeito</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister().then((boolean) => {
                if (boolean) console.log('Service Worker antigo desregistrado com sucesso.');
              });
            }
          }).catch((err) => console.error('Erro ao desregistrar Service Worker:', err));
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('Service Worker registrado com sucesso:', reg.scope))
              .catch((err) => console.error('Erro ao registrar Service Worker:', err));
          });
        }
      }
    </script>
  </body>
</html>
